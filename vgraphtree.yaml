project:
  root: .
  lsp:
    rust: rust-analyzer
  depth_ceiling: 2

nodes:
  frontend:
    label: Web frontend
    source: static/
    pin: { x: 1100.0, y: 200.0 }
    children:
      mod_app:         { label: App entry,   source: static/app.js }
      mod_state:       { label: State,        source: static/state.js }
      mod_constants:   { label: Constants,    source: static/constants.js }
      mod_geometry:    { label: Geometry,     source: static/geometry.js }
      mod_lod:         { label: LOD,          source: static/lod.js }
      mod_render:      { label: Render,        source: static/render.js }
      mod_simulation:  { label: Simulation,   source: static/simulation.js }
      mod_code_panel:  { label: Code panel,   source: static/code-panel.js }
      mod_interaction: { label: Interaction,  source: static/interaction.js }
      api_client:      { label: API client,   source: static/api.js }
      stylesheet:      { label: Stylesheet,   source: static/style.css }
      html_entry:      { label: HTML entry,   source: static/index.html }

  yaml_store:
    label: YAML store
    source: vgraphtree.yaml
    pin: { x: 625.0, y: 700.0 }

  backend:
    label: Rust backend
    source: vgraphtree-server/
    pin: { x: 150.0, y: 200.0 }
    children:
      route_handlers:
        label: Route handlers
        source: vgraphtree-server/src/routes/
        children:
          save:  { label: Save,  source: vgraphtree-server/src/routes/save.rs }
          graph: { label: Graph, source: vgraphtree-server/src/routes/graph.rs }
          edge:  { label: Edge,  source: vgraphtree-server/src/routes/edge.rs }
          node:  { label: Node,  source: vgraphtree-server/src/routes/node.rs }
          file:  { label: File,  source: vgraphtree-server/src/routes/file.rs }
      config_parser: { label: Config parser, source: vgraphtree-server/src/config.rs }
      graph_types:   { label: Graph types,   source: vgraphtree-server/src/graph.rs }
      server_entry:  { label: Server entry,  source: vgraphtree-server/src/main.rs }

edges:
  # ─── Cross-system ─────────────────────────────────────────────────────────
  - { from: frontend, to: backend,    annotation: HTTP fetch API }
  - { from: backend,  to: yaml_store, annotation: atomic read/write }

  # ─── Rust backend ─────────────────────────────────────────────────────────
  - { from: config_parser, to: graph_types,   annotation: produces NodeGraph }
  - { from: route_handlers, to: graph_types,  annotation: mutates graph }
  - { from: server_entry, to: config_parser,  annotation: parse on startup }
  - { from: server_entry, to: route_handlers, annotation: registers handlers }
  - { from: server_entry, to: graph_types,    annotation: owns NodeGraph }

  # ─── JS module import graph ───────────────────────────────────────────────
  - { from: mod_app, to: api_client,       annotation: fetchGraph / postSave }
  - { from: mod_app, to: mod_state,        annotation: shared mutable state }
  - { from: mod_app, to: mod_lod,          annotation: expand / collapse triggers }
  - { from: mod_app, to: mod_simulation,   annotation: rebuild on refresh }
  - { from: mod_app, to: mod_render,       annotation: initial render + refresh }
  - { from: mod_app, to: mod_interaction,  annotation: wire up event handlers }
  - { from: mod_app, to: mod_code_panel,   annotation: normaliseSource }
  - { from: mod_interaction, to: mod_lod,        annotation: expand / collapse calls }
  - { from: mod_interaction, to: mod_render,     annotation: rerenderEdges / updateContainers }
  - { from: mod_interaction, to: mod_simulation, annotation: rebuild after mutation }
  - { from: mod_interaction, to: mod_code_panel, annotation: open on node click }
  - { from: mod_interaction, to: api_client,     annotation: patchNode / patchEdge }
  - { from: mod_simulation, to: mod_render,   annotation: "tick: update DOM" }
  - { from: mod_simulation, to: mod_lod,      annotation: visibility + label radius }
  - { from: mod_simulation, to: mod_geometry, annotation: edge endpoints / zones }
  - { from: mod_render, to: mod_lod,      annotation: isNodeVisible / visibleDescendants }
  - { from: mod_render, to: mod_geometry, annotation: edge endpoints }
  - { from: mod_code_panel, to: api_client,   annotation: fetchFile }
  - { from: mod_code_panel, to: mod_geometry, annotation: getViewportSize }
  - { from: mod_lod, to: mod_state,         annotation: reads / mutates nodes }
  - { from: mod_geometry, to: mod_state,    annotation: SVG viewport ref }
  - { from: mod_render, to: mod_state,      annotation: "live bindings: nodes, edges" }
  - { from: mod_simulation, to: mod_state,  annotation: live bindings + setSimulation }
  - { from: mod_interaction, to: mod_state, annotation: live bindings + setters }
  - { from: mod_code_panel, to: mod_state,  annotation: nodes / sourceToNode / svg }
  - { from: mod_geometry, to: mod_constants, annotation: node box dimensions }
  - { from: mod_render, to: mod_constants,   annotation: node box dimensions }
