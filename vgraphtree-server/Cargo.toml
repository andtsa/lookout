[package]
name = "vgraphtree-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vgraphtree"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
